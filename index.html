<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Primary Meta Tags -->
    <title>M&D Care | Specialist Adult Social Care Across Wales</title>
    <meta
      name="description"
      content="M&D Care provides specialist, person-centred adult social care across Wales. Learn more about our residential, supported living and community services."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="M&D Care | Specialist Adult Social Care Across Wales"
    />
    <meta
      property="og:description"
      content="M&D Care provides specialist, person-centred adult social care across Wales. Learn more about our residential, supported living and community services."
    />
    <meta property="og:url" content="https://manddcare.co.uk" />
    <meta
      property="og:image"
      content="https://manddcare.co.uk/images/og-image.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="M&D Care | Specialist Adult Social Care Across Wales"
    />
    <meta
      name="twitter:description"
      content="M&D Care provides specialist, person-centred adult social care across Wales. Learn more about our residential, supported living and community services."
    />
    <meta
      name="twitter:image"
      content="https://manddcare.co.uk/images/og-image.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://manddcare.co.uk" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
